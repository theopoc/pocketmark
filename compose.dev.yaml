# Per-worktree stack: the project name, host port and image tag come from
# .env.worktree (generated by scripts/dev_env.sh). Start it with `make up`,
# not with a bare `docker compose`.
services:
  dev-postgres:
    image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    environment:
      POSTGRES_DB: pocketmark
      POSTGRES_PASSWORD: &dev_password pocketmark-local-dev
    volumes:
      - dev-postgres:/var/lib/postgresql
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/10-pocketmark.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pocketmark", "-d", "pocketmark"]
      interval: 5s
      timeout: 3s
      retries: 12

  dev-pocketmark:
    build: .
    image: ${POCKETMARK_DEV_IMAGE:?run make up}
    depends_on:
      dev-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${POCKETMARK_DEV_PORT:?run make up}:8090"
    environment:
      POCKETMARK_DATABASE_URL: postgresql://pocketmark@dev-postgres/pocketmark?sslmode=disable
      PGPASSWORD: *dev_password
    volumes:
      - dev-state:/data
    mem_limit: 128m
    cpus: 1.0
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  dev-postgres:
  dev-state:
