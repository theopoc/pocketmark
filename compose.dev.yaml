# Per-worktree stack: the project name, host port and image tag come from
# .env.worktree (generated by scripts/dev_env.sh). Start it with `make up`,
# not with a bare `docker compose`.
services:
  dev-postgres:
    image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    environment:
      POSTGRES_DB: pocketmark
      POSTGRES_PASSWORD: &dev_password pocketmark-local-dev
    volumes:
      - dev-postgres:/var/lib/postgresql
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/10-pocketmark.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pocketmark", "-d", "pocketmark"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Disposable S3 bucket for backup tests. Single-node Garage bootstraps its
  # layout, access key and bucket itself; data lives in tmpfs and `make up`
  # recreates the container, so every stack starts with an empty bucket.
  dev-garage:
    image: dxflrs/garage:v2.6.0@sha256:4b5a318fc9fe2fbec5d3af590eeafe05d83492e6411266fa0b9e215c20264013
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${POCKETMARK_DEV_GARAGE_RPC_SECRET:?run make up}
      GARAGE_DEFAULT_ACCESS_KEY: &s3_access_key ${POCKETMARK_DEV_S3_ACCESS_KEY:?run make up}
      GARAGE_DEFAULT_SECRET_KEY: &s3_secret_key ${POCKETMARK_DEV_S3_SECRET_KEY:?run make up}
      GARAGE_DEFAULT_BUCKET: &s3_bucket pocketmark-dev
    volumes:
      - ./scripts/garage.toml:/etc/garage.toml:ro
    ports:
      - "127.0.0.1:${POCKETMARK_DEV_S3_PORT:?run make up}:3900"
    tmpfs:
      - /var/lib/garage:size=256m
    # The image has no shell: ask the Garage CLI (over RPC) for the default bucket.
    # Keep the bucket name in sync with &s3_bucket and POCKETMARK_TEST_S3_BUCKET
    # in scripts/dev_env.sh.
    healthcheck:
      test: ["CMD", "/garage", "bucket", "info", "pocketmark-dev"]
      interval: 2s
      timeout: 3s
      retries: 15
    # The tmpfs counts against this limit.
    mem_limit: 512m
    pids_limit: 64
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  dev-pocketmark:
    build: .
    image: ${POCKETMARK_DEV_IMAGE:?run make up}
    depends_on:
      dev-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${POCKETMARK_DEV_PORT:?run make up}:8090"
    environment:
      POCKETMARK_DATABASE_URL: postgresql://pocketmark@dev-postgres/pocketmark?sslmode=disable
      PGPASSWORD: *dev_password
      # Backup destination only: the schedule stays paused until enabled in the UI.
      POCKETMARK_BACKUP_S3_ENDPOINT: http://dev-garage:3900
      POCKETMARK_BACKUP_S3_REGION: garage
      POCKETMARK_BACKUP_S3_BUCKET: *s3_bucket
      POCKETMARK_BACKUP_S3_ACCESS_KEY_ID: *s3_access_key
      POCKETMARK_BACKUP_S3_SECRET_ACCESS_KEY: *s3_secret_key
      POCKETMARK_BACKUP_S3_ALLOW_HTTP: "true"
    volumes:
      - dev-state:/data
    # Faster than the image's 30 s HEALTHCHECK so `make up --wait` returns quickly.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15
    mem_limit: 128m
    cpus: 1.0
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  dev-postgres:
  dev-state:
