version: 2
project_name: pocketmark

# Native CI jobs build static Go binaries. OSS meta archives package those exact files.
builds:
  - skip: true

archives:
  - id: linux-amd64
    meta: true
    formats: [tar.gz]
    name_template: pocketmark-linux-amd64
    files:
      - src: artifacts/linux-amd64/pocketmark
        dst: pocketmark
        info:
          mode: 0755
      - src: docs/RELEASE_INSTALL.md
        dst: README.md
  - id: linux-arm64
    meta: true
    formats: [tar.gz]
    name_template: pocketmark-linux-arm64
    files:
      - src: artifacts/linux-arm64/pocketmark
        dst: pocketmark
        info:
          mode: 0755
      - src: docs/RELEASE_INSTALL.md
        dst: README.md
  - id: extension
    meta: true
    formats: [zip]
    name_template: pocketmark-extension
    files:
      - {src: extension/manifest.json, dst: manifest.json}
      - {src: extension/popup.html, dst: popup.html}
      - {src: extension/popup.js, dst: popup.js}
      - {src: extension/popup.css, dst: popup.css}
      - {src: extension/selectors.js, dst: selectors.js}
      - {src: extension/theme-switch.js, dst: theme-switch.js}
      - {src: extension/ui-theme.js, dst: ui-theme.js}
      - {src: extension/name-limit.js, dst: name-limit.js}
      - {src: extension/README.md, dst: README.md}
      - {src: extension/background.js, dst: background.js}
      - {src: extension/common.js, dst: common.js}
      - {src: extension/capture.js, dst: capture.js}
      - {src: extension/job-store.js, dst: job-store.js}
      - {src: extension/save-toast.js, dst: save-toast.js}
      - {src: extension/icon.svg, dst: icon.svg}
      - {src: extension/icon-16.png, dst: icon-16.png}
      - {src: extension/icon-24.png, dst: icon-24.png}
      - {src: extension/icon-32.png, dst: icon-32.png}
      - {src: extension/icon-48.png, dst: icon-48.png}
      - {src: extension/icon-128.png, dst: icon-128.png}

checksum:
  name_template: SHA256SUMS
  algorithm: sha256
  extra_files:
    - glob: artifacts/linux-amd64/pocketmark-linux-amd64.buildinfo.txt
    - glob: artifacts/linux-arm64/pocketmark-linux-arm64.buildinfo.txt

# Upload into the existing draft; the workflow publishes only after verification.
release:
  github:
    owner: theopoc
    name: pocketmark
  draft: true
  use_existing_draft: true
  mode: keep-existing
  replace_existing_artifacts: false
  extra_files:
    - glob: artifacts/linux-amd64/pocketmark-linux-amd64.buildinfo.txt
    - glob: artifacts/linux-arm64/pocketmark-linux-arm64.buildinfo.txt
changelog:
  disable: true
