name: Dependabot update branch

# Protect main requires up-to-date branches, and Dependabot only rebases on
# conflicts. Ask it to rebase PRs that are merely behind. Assumptions to verify
# on the first real run: Dependabot honors a comment from github-actions[bot],
# and its own push starts the normal pull_request CI (a GITHUB_TOKEN push or a
# dispatch does not satisfy the required check). If it ignores the comment, the
# job stops asking after three unanswered requests per PR and warns.
# Merges made with GITHUB_TOKEN do not trigger push workflows, so the schedule
# is the dependable trigger; push covers merges made by a person.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependabot-update-branch
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Never check out or execute PR code in this write-enabled workflow.
      - name: Ask Dependabot to rebase one PR that is behind main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prs=$(gh pr list --state open --base main --limit 200 \
            --json number,headRefOid,isDraft,isCrossRepository,author,autoMergeRequest,createdAt,statusCheckRollup \
            --jq '[.[] | select(.author.login == "app/dependabot" or .author.login == "dependabot[bot]")
              | select(.isDraft | not) | select(.isCrossRepository | not)
              | select(.autoMergeRequest != null)] | sort_by(.createdAt)')

          stale=$(date -u -d '6 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          candidates=()
          for row in $(jq -r '.[] | @base64' <<< "$prs"); do
            pr=$(base64 -d <<< "$row")
            number=$(jq -r .number <<< "$pr")
            sha=$(jq -r .headRefOid <<< "$pr")
            # PRs whose CI failed need a human or a Dependabot rebase, not another run.
            failed=$(jq '[.statusCheckRollup[]? | select(.conclusion == "FAILURE" or .conclusion == "CANCELLED" or .conclusion == "TIMED_OUT" or .conclusion == "STARTUP_FAILURE" or .conclusion == "ACTION_REQUIRED" or .state == "FAILURE" or .state == "ERROR")] | length' <<< "$pr")
            [[ "$failed" == 0 ]] || { echo "PR #$number has failed checks; skipped."; continue; }
            # Any running check means a PR is in flight: handle one PR at a time.
            # Checks stuck for over six hours (never started, awaiting approval) do not count.
            pending=$(jq --arg cutoff "$stale" '[.statusCheckRollup[]? | select((((.status // "COMPLETED") != "COMPLETED") or .state == "PENDING") and ((.startedAt // .createdAt // "") > $cutoff))] | length' <<< "$pr")
            if [[ "$pending" != 0 ]]; then
              echo "PR #$number has checks running; nothing to do."
              exit 0
            fi
            behind=$(gh api "repos/$GH_REPO/compare/main...$sha" --jq .behind_by)
            if [[ "$behind" != 0 ]]; then
              candidates+=("$number $sha")
            else
              # Not blocking the others: it is blocked for another reason.
              if [[ "$(jq '[.statusCheckRollup[]? | select(.name == "CI")] | length' <<< "$pr")" == 0 ]]; then
                echo "::warning::PR #$number is up to date but has no CI check; its pull_request run may not have started."
              else
                echo "PR #$number is up to date but has not merged."
              fi
            fi
          done

          window=$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          for candidate in "${candidates[@]}"; do
            read -r number sha <<< "$candidate"
            pushed=$(gh api "repos/$GH_REPO/commits/$sha" --jq .commit.committer.date)
            # Requests newer than the head went unanswered (a rebase changes the head).
            requests=$(gh api --paginate "repos/$GH_REPO/issues/$number/comments?per_page=100" \
              --jq '.[] | select(.body == "@dependabot rebase" and .user.login == "github-actions[bot]") | .created_at' | sort)
            unanswered=$(awk -v pushed="$pushed" '$0 > pushed' <<< "$requests")
            count=$(grep -c . <<< "$unanswered" || true)
            latest=$(tail -n 1 <<< "$unanswered")
            if [[ "$count" -gt 0 && "$latest" > "$window" ]]; then
              echo "PR #$number: rebase requested at $latest; waiting for Dependabot."
              exit 0
            fi
            if [[ "$count" -ge 3 ]]; then
              echo "::warning::Dependabot ignored $count rebase requests on PR #$number; skipped."
              continue
            fi
            gh pr comment "$number" --body '@dependabot rebase'
            echo "Asked Dependabot to rebase PR #$number."
            exit 0
          done
          echo 'No Dependabot PR needs a rebase.'
