name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable tag to verify or resume (empty uses the selected ref)'
        required: false
        default: ''
        type: string
      publish:
        description: 'Publish the specified existing tag after all checks pass'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare release PR and draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # GITHUB_TOKEN-created PRs do not emit pull_request workflow runs.
      # workflow_dispatch is an explicit exception and checks the PR's own SHA.
      - name: Run CI on the release PR
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ fromJSON(steps.release.outputs.pr || '{}').number }}
        run: |
          branch=$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)
          gh workflow run ci.yml --ref "$branch"

  validate:
    name: Validate release ref
    needs: release-please
    if: >-
      always() && (needs.release-please.outputs.tag != '' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      tag: ${{ steps.source.outputs.tag }}
      publish: ${{ steps.source.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag || inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version tag on main, or a manual dry run
        id: source
        env:
          RELEASE_REF: ${{ needs.release-please.outputs.tag || inputs.tag || github.ref_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        shell: bash
        run: |
          if [[ "$PUBLISH" == true || -n "$REQUESTED_TAG" ]]; then
            [[ "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            echo "tag=$RELEASE_REF" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$PUBLISH" != true ]]; then
            echo 'Manual dry run: assemble and verify packages without publishing a release.'
          fi
          git merge-base --is-ancestor HEAD origin/main
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  verify:
    name: Require validated main image and binaries
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.ci.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ needs.validate.outputs.revision }}
        run: python3 scripts/validated_ci.py --revision "$REVISION"

  assemble:
    name: Package and verify with GoReleaser
    needs: [validate, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.verify.outputs.run_id }}
          pattern: linux-*
          path: artifacts
          digest-mismatch: error
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          install-only: true
      - name: Package tested binaries and allowlisted extension files
        env:
          PUBLISH: ${{ needs.validate.outputs.publish }}
          REVISION: ${{ needs.validate.outputs.revision }}
        shell: bash
        run: |
          if [[ "$PUBLISH" != true ]]; then
            goreleaser release --snapshot --clean --config .goreleaser.yaml
          else
            goreleaser release --skip=publish --clean --config .goreleaser.yaml
          fi
          python3 scripts/verify_release.py --directory dist --metadata artifacts \
            --commit "$REVISION" --output artifacts/verified
      - name: Exercise publication configuration without publishing
        run: goreleaser release --snapshot --skip=archive --clean --config .goreleaser-publish.yaml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release
          path: artifacts/verified/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: needs.validate.outputs.publish == 'true'
    needs: [validate, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: artifacts/verified
          digest-mismatch: error
      - name: Recheck assets and require an unpublished version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          REVISION: ${{ needs.validate.outputs.revision }}
        shell: bash
        run: |
          python3 scripts/verify_release.py --directory artifacts/verified --commit "$REVISION"
          # Listing with write access includes drafts; the tag endpoint is for published releases.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/release-state.json"
          python3 - "$RUNNER_TEMP/release-state.json" "$RELEASE_TAG" "$REVISION" <<'PY'
          import json, sys
          from scripts.verify_release import verify_release_state
          verify_release_state(json.load(open(sys.argv[1])), sys.argv[2], sys.argv[3])
          PY
      - name: Publish exactly the verified artifacts with GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --config .goreleaser-publish.yaml --skip=archive --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

  container:
    name: Publish and verify GHCR image
    needs: [validate, publish]
    if: needs.validate.outputs.publish == 'true'
    uses: ./.github/workflows/container-release.yml
    with:
      tag: ${{ needs.validate.outputs.tag }}
    permissions:
      contents: read
      actions: read
      packages: write
