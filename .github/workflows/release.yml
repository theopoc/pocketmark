name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release ref
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version tag on main, or a manual dry run
        env:
          RELEASE_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            echo 'Manual run: assemble and verify packages without publishing a release.'
          else
            [[ "$RELEASE_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          fi
          git merge-base --is-ancestor HEAD origin/main

  verify:
    name: Verify release source
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  assemble:
    name: Assemble verified assets
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
          digest-mismatch: error
      - name: Check the complete asset set and generate SHA256SUMS
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('dist')
          expected = {
              'pocketmark-linux-amd64.tar.gz', 'pocketmark-linux-arm64.tar.gz',
              'pocketmark-linux-amd64.buildinfo.txt', 'pocketmark-linux-arm64.buildinfo.txt',
              'pocketmark-extension.zip', 'pocketmark-extension-advanced.zip',
          }
          actual = {p.name for p in root.iterdir()}
          if actual != expected:
              raise SystemExit(f'Unexpected release assets: {actual ^ expected}')
          lines = []
          for name in sorted(expected):
              path = root / name
              if path.is_symlink() or not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'Invalid release asset: {name}')
              lines.append(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {name}\n')
          (root / 'SHA256SUMS').write_text(''.join(lines))
          PY
          (cd dist && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release
          path: dist
          digest-mismatch: error
      - name: Publish exactly the verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "Pocketmark $RELEASE_TAG"
