name: Container release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published stable release tag to package (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: container-release-${{ github.repository }}-${{ inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Validate published release and source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      revision: ${{ steps.release.outputs.revision }}
      image: ${{ steps.release.outputs.image }}
      run_id: ${{ steps.release.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/container_release.py prepare --tag "$RELEASE_TAG"

  publish:
    name: Promote the validated SHA index without rebuilding
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Assign the version tag to the exact validated main digest
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REVISION: ${{ needs.prepare.outputs.revision }}
          RUN_ID: ${{ needs.prepare.outputs.run_id }}
        run: |
          python3 scripts/container_release.py promote --image "$IMAGE" --tag "$TAG" \
            --revision "$REVISION" --run-id "$RUN_ID"

  verify:
    name: Test published tag (${{ matrix.arch }})
    needs: [prepare, publish]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull the published tag and test it natively
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          ARCH: ${{ matrix.arch }}
          REVISION: ${{ needs.prepare.outputs.revision }}
        run: |
          python3 scripts/qualify_image.py --image "$IMAGE:$TAG" --digest "$DIGEST" \
            --revision "$REVISION" --platform "linux/$ARCH" --report "reports/published-$ARCH.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: container-published-evidence-${{ matrix.arch }}
          path: reports/*.json
          if-no-files-found: error
          retention-days: 7
