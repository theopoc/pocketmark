name: Renovate config

# Not a required check: it only runs when the Renovate configuration or this workflow changes.
on:
  pull_request:
    branches: [main]
    paths:
      - .github/renovate.json5
      - .github/workflows/renovate-config.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate-config-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Renovate config
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Validate the Renovate configuration
        env:
          # renovate: datasource=npm depName=renovate
          RENOVATE_VERSION: '44.247.1'
        run: >-
          npx --yes --ignore-scripts --package="renovate@$RENOVATE_VERSION"
          -- renovate-config-validator --strict .github/renovate.json5
