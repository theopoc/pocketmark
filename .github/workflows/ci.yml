name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  schedule:
    # Recheck advisories and runner/tool drift even when main has no new commits.
    - cron: '23 5 * * 1'
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.revision || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

env:
  CGO_ENABLED: '1'

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install Commitlint
        run: npm ci --prefix tools/quality --ignore-scripts --no-audit --no-fund
      - name: Test Commitlint title validation
        run: node --test tools/quality/*.test.cjs
      - name: Validate the squash commit title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          [[ "$PR_TITLE" != *$'\n'* && "$PR_TITLE" != *$'\r'* ]]
          printf '%s\n' "$PR_TITLE" | tools/quality/node_modules/.bin/commitlint --strict
      - run: go mod verify
      - run: go mod tidy -diff
      - run: make check
      - name: Validate workflow syntax and shell commands
        # GitHub supports queue:max; actionlint 1.7.12 and current upstream do not.
        # Ignore only that unknown-key diagnostic, retaining all other lint checks.
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          -ignore '^unexpected key "queue" for "concurrency" section\.' -color
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          install-only: true
      - run: make release-check

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Scan the complete history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: '8.30.1'
          # Use the action's full-history mode instead of an event range.
          GITHUB_EVENT_NAME: workflow_dispatch
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
      - name: Check reachable dependency vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 -tags=sqlite_fts5,sqlite_omit_load_extension ./...

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --prefix tools/security --ignore-scripts --no-audit --no-fund
      - run: npm audit --prefix tools/security --audit-level=high
      - run: npm audit --prefix frontend --audit-level=high
      - run: npm audit --prefix e2e --audit-level=high
      - run: npm audit --prefix tools/quality --audit-level=high
      - name: Verify vendored Swagger UI matches the scanned package
        run: python3 scripts/check_swagger_vendor.py
      - name: Scan the actual embedded JavaScript bundle
        run: tools/security/node_modules/.bin/retire --path internal/webui/static/api-docs/vendor --severity high

  sast:
    name: SAST (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # PRs must enforce the same complete findings gate as main.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: .github/codeql.yml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.language == 'go'
        with:
          node-version: '24'
      - if: matrix.language == 'go'
        run: GOFLAGS=-a make build
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          output: artifacts/codeql
          upload: never
          upload-database: false
      - name: Block on findings or missing analysis
        run: python3 scripts/check_sarif.py artifacts/codeql
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sast-${{ matrix.language }}
          path: artifacts/codeql/*.sarif
          retention-days: 7

  test:
    name: Tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Race tests and coverage
        run: |
          make frontend
          go test -json -race -p 2 -count=1 -covermode=atomic -coverprofile=coverage.out \
            -tags 'sqlite_fts5 sqlite_omit_load_extension' ./... | tee test-results.log
      - name: Summarize test timings
        if: always()
        run: python3 scripts/test_timings.py test-results.log >> "$GITHUB_STEP_SUMMARY"
      - name: Test release packaging
        if: matrix.arch == 'amd64'
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Test workflow expressions
        if: matrix.arch == 'amd64'
        run: |
          npm install --prefix "$RUNNER_TEMP/release-expressions" --no-save --no-package-lock \
            --ignore-scripts --no-audit --no-fund @actions/expressions@0.3.61
          ACTIONS_EXPRESSIONS_PATH="$RUNNER_TEMP/release-expressions/node_modules/@actions/expressions/dist/index.js" \
            RELEASE_WORKFLOW_PATH="$GITHUB_WORKSPACE/.github/workflows/release.yml" \
            DEPENDABOT_WORKFLOW_PATH="$GITHUB_WORKSPACE/.github/workflows/dependabot-auto-merge.yml" \
            node --test scripts/test_*_expressions.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-${{ matrix.arch }}
          path: coverage.out
          retention-days: 7

  extension:
    name: Web and extension
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build test server and run JavaScript regressions once
        run: |
          make build test-extension
          node --test internal/webui/*.test.cjs
          npm test --prefix frontend
      - name: Install selector browser tooling
        run: |
          npm ci --prefix e2e --ignore-scripts --no-audit --no-fund
          ./e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Test browser and extension journeys
        run: |
          node e2e/selectors.mjs
          node e2e/extension-selectors.mjs
          python3 scripts/smoke_frontend.py --binary bin/pocketmark

  gate:
    name: CI
    needs: [quality, security, sast, test, extension]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
