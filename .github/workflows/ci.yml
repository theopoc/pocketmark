name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

env:
  CGO_ENABLED: '1'

jobs:
  quality:
    name: Quality and extension packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: go mod verify
      - run: go mod tidy -diff
      - run: make check
      - run: make test-extension
      - name: Validate workflow syntax and shell commands
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Test release packaging
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: make package-extensions
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-extensions
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  security:
    name: Secrets and reachable Go vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Scan the complete history for secrets
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts=--all
      - name: Check reachable dependency vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 -tags=sqlite_fts5,sqlite_omit_load_extension ./...

  test-build:
    name: Test, build and Docker (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Race tests and coverage
        run: make test TEST_FLAGS='-race -p 1 -count=1 -covermode=atomic -coverprofile=coverage.out'
      - name: Install the static C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - name: Build the static release executable
        run: |
          CC=musl-gcc make build LDFLAGS='-s -w -linkmode external -extldflags "-static"'
          file bin/pocketmark | grep 'statically linked'
          ./bin/pocketmark -h
      - name: Package the tested architecture
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          python3 scripts/package_release.py linux --arch "$RELEASE_ARCH" --output dist
          go version -m bin/pocketmark > "dist/pocketmark-linux-$RELEASE_ARCH.buildinfo.txt"
      - name: Build and test the native container
        run: |
          docker build --tag pocketmark:ci .
          python3 scripts/smoke_docker.py --image pocketmark:ci --output reports/docker-smoke.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence-${{ matrix.arch }}
          path: |
            coverage.out
            reports/docker-smoke.json
          retention-days: 7

  required:
    name: CI passed
    if: always()
    needs: [quality, security, test-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failures = [name for name, job in results.items() if job['result'] != 'success']
          if failures:
              raise SystemExit('Unsuccessful CI jobs: ' + ', '.join(failures))
          PY
