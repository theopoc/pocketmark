name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  schedule:
    # Recheck advisories and runner/tool drift even when main has no new commits.
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

env:
  CGO_ENABLED: '1'

jobs:
  plan:
    name: Select checks and validate PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      server: ${{ steps.plan.outputs.server }}
      extension: ${{ steps.plan.outputs.extension }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the squash commit title
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_pr_title.py
      - id: plan
        run: python3 scripts/ci_plan.py select

  quality:
    needs: plan
    if: needs.plan.outputs.server == 'true'
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/go-cache
        with:
          mode: quality
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: go mod verify
      - run: go mod tidy -diff
      - run: make check
      - name: Validate workflow syntax and shell commands
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          install-only: true
      - run: make release-check

  security:
    needs: plan
    if: always()
    name: Secrets and reachable Go vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/go-cache
        if: needs.plan.outputs.server == 'true'
        with:
          mode: security
      - name: Scan the complete history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: '8.30.1'
          # Use the action's full-history mode instead of an event range.
          GITHUB_EVENT_NAME: workflow_dispatch
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
      - name: Check reachable dependency vulnerabilities
        if: needs.plan.outputs.server == 'true'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 -tags=sqlite_fts5,sqlite_omit_load_extension ./...

  test:
    needs: plan
    if: needs.plan.outputs.server == 'true'
    name: Tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/go-cache
        with:
          mode: race-cover
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Race tests and coverage
        run: |
          make test TEST_FLAGS='-json -race -p 2 -count=1 -covermode=atomic -coverprofile=coverage.out' | tee test-results.log
      - name: Summarize test timings
        if: always()
        run: python3 scripts/test_timings.py test-results.log >> "$GITHUB_STEP_SUMMARY"
      - name: Test release packaging
        if: matrix.arch == 'amd64'
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Test workflow expressions
        if: matrix.arch == 'amd64'
        run: |
          npm install --prefix "$RUNNER_TEMP/release-expressions" --no-save --no-package-lock \
            --ignore-scripts --no-audit --no-fund @actions/expressions@0.3.61
          ACTIONS_EXPRESSIONS_PATH="$RUNNER_TEMP/release-expressions/node_modules/@actions/expressions/dist/index.js" \
            RELEASE_WORKFLOW_PATH="$GITHUB_WORKSPACE/.github/workflows/release.yml" \
            DEPENDABOT_WORKFLOW_PATH="$GITHUB_WORKSPACE/.github/workflows/dependabot-auto-merge.yml" \
            node --test scripts/test_*_expressions.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-${{ matrix.arch }}
          path: coverage.out
          retention-days: 7

  build:
    needs: plan
    if: needs.plan.outputs.server == 'true'
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the static C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - uses: ./.github/actions/go-cache
        with:
          mode: musl-static
      - name: Build the static release executable
        run: |
          CC=musl-gcc make build LDFLAGS='-s -w -linkmode external -extldflags "-static"'
          file bin/pocketmark | grep 'statically linked'
          ./bin/pocketmark -h
      - name: Preserve the tested executable and build metadata
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "artifacts/linux-$RELEASE_ARCH"
          cp bin/pocketmark "artifacts/linux-$RELEASE_ARCH/pocketmark"
          go version -m bin/pocketmark > "artifacts/linux-$RELEASE_ARCH/pocketmark-linux-$RELEASE_ARCH.buildinfo.txt"
          python3 scripts/prepare_image.py --directory "artifacts/linux-$RELEASE_ARCH" \
            --arch "$RELEASE_ARCH" --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/image-context"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: artifacts/linux-${{ matrix.arch }}/*
          if-no-files-found: error
          retention-days: 90

  extension:
    name: Extension
    needs: plan
    if: needs.plan.outputs.extension == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validate extension syntax
        run: |
          for source in extension/*.js; do node --check "$source"; done
          python3 -m py_compile extension/package.py
      - run: make test-extension
      - name: Validate the installable extension package
        run: python3 -m unittest discover -s scripts -p 'test_package_extension.py' -v

  required:
    name: CI passed
    if: always()
    needs: [plan, quality, security, test, build, extension]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require exactly the selected jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_plan.py require
