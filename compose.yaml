services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: pocketmark
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POCKETMARK_DB_PASSWORD:?Set POCKETMARK_DB_PASSWORD in .env}
    volumes:
      - pocketmark-postgres:/var/lib/postgresql
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/10-pocketmark.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pocketmark", "-d", "pocketmark"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  pocketmark:
    depends_on:
      postgres:
        condition: service_healthy
    build: .
    image: ${POCKETMARK_IMAGE:-pocketmark:local}
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - pocketmark-state:/data
    environment:
      POCKETMARK_DATABASE_URL: postgresql://pocketmark@postgres/pocketmark?sslmode=disable
      POCKETMARK_SERVER_SECRET: ${POCKETMARK_SERVER_SECRET:-}
      POCKETMARK_BACKUP_ENABLED: ${POCKETMARK_BACKUP_ENABLED:-}
      POCKETMARK_BACKUP_CRON: ${POCKETMARK_BACKUP_CRON:-}
      POCKETMARK_BACKUP_TIMEZONE: ${POCKETMARK_BACKUP_TIMEZONE:-}
      POCKETMARK_BACKUP_WINDOW: ${POCKETMARK_BACKUP_WINDOW:-}
      POCKETMARK_BACKUP_RETENTION_DAYS: ${POCKETMARK_BACKUP_RETENTION_DAYS:-}
      POCKETMARK_BACKUP_S3_ENDPOINT: ${POCKETMARK_BACKUP_S3_ENDPOINT:-}
      POCKETMARK_BACKUP_S3_REGION: ${POCKETMARK_BACKUP_S3_REGION:-}
      POCKETMARK_BACKUP_S3_BUCKET: ${POCKETMARK_BACKUP_S3_BUCKET:-}
      POCKETMARK_BACKUP_S3_PREFIX: ${POCKETMARK_BACKUP_S3_PREFIX:-}
      POCKETMARK_BACKUP_S3_ACCESS_KEY_ID: ${POCKETMARK_BACKUP_S3_ACCESS_KEY_ID:-}
      POCKETMARK_BACKUP_S3_SECRET_ACCESS_KEY: ${POCKETMARK_BACKUP_S3_SECRET_ACCESS_KEY:-}
      POCKETMARK_BACKUP_S3_ALLOW_HTTP: ${POCKETMARK_BACKUP_S3_ALLOW_HTTP:-}
      POCKETMARK_BACKUP_TELEGRAM_BOT_TOKEN: ${POCKETMARK_BACKUP_TELEGRAM_BOT_TOKEN:-}
      POCKETMARK_BACKUP_TELEGRAM_CHAT_ID: ${POCKETMARK_BACKUP_TELEGRAM_CHAT_ID:-}
      POCKETMARK_TOKEN: ${POCKETMARK_TOKEN:-}
      PGPASSWORD: ${POCKETMARK_DB_PASSWORD:?Set POCKETMARK_DB_PASSWORD in .env}
      GOMEMLIMIT: 32MiB
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    mem_limit: 128m
    cpus: 1.0
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
volumes:
  pocketmark-postgres:
  pocketmark-state:
